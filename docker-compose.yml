services:
  app:
    build: .
    image: laboratorio-agentes:latest
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./aceitacao:/app/aceitacao:ro
    working_dir: /app
    command: ["python", "-m", "src.main", "--issue", "1", "--simular"]

  testes:
    profiles: ["testes"]
    build: .
    working_dir: /app
    volumes:
      - .:/app
    command: ["python", "-m", "pytest", "-q", "tests"]
